# Settings for the can_bridge node. Change these instead of editing code.
can_bridge:
  ros__parameters:
    # Name of the USB-CAN adapter's network interface (see scripts/setup_can.sh)
    can_interface: can0

    # SPARK MAX CAN IDs. These are the main-branch values; the
    # depositor-and-excavator branch used different ones (depositor 13,
    # excavator motor 14, actuator 15). CONFIRM AGAINST THE REAL ROBOT
    # (REV Hardware Client shows each SPARK MAX's ID).
    drive_left_id: 11
    drive_right_id: 10
    depositor_id: 12
    excavator_actuator_id: 13
    excavator_motor_id: 14

    # Safety limits (commands outside these are clamped)
    depositor_min_position: -1000.0   # rotations
    depositor_max_position: 1000.0
    excavator_output_min: -1.0        # duty cycle
    excavator_output_max: 1.0
    excavator_velocity_min: -5000.0   # RPM
    excavator_velocity_max: 5000.0

    # true = old joystick behavior (turning flips when backing up).
    # Nav2 expects false.
    invert_turn_when_reversing: true

    # false = motors stay off until something publishes true on /enabled
    start_enabled: false
